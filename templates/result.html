<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Обработанное изображение</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<fieldset class="block">
    <legend> Результат обработки</legend>

<h2>Исходное изображение</h2>
<img src="{{original}}" width="300">

<h2>Повернутое изображение</h2>
<img src="{{ rotated }}" width="300">
</fieldset>

<fieldset class="block">
<legend> Гистограммы оригинального изображения</legend>
    <div class="hist-row">
    <img src="{{ r_orig }}" width="300">
    <img src="{{ g_orig }}" width="300">
    <img src="{{ b_orig }}" width="300">
    </div>
</fieldset>

<fieldset>
<legend>Гистограммы повернутого изображения</legend>
    <div class="hist-row">
    <img src="{{ r_rot }}" width="300">
    <img src="{{ g_rot }}" width="300">
    <img src="{{ b_rot }}" width="300">
    </div>
</fieldset>

</body>
</html>
